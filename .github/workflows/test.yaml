name: test

on:
push:
workflow_dispatch:

jobs:
test:
runs-on: ubuntu-24.04

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Install iverilog
    shell: bash
    run: sudo apt-get update && sudo apt-get install -y iverilog

  - name: Setup python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install Python packages
    shell: bash
    run: pip install -r test/requirements.txt

  - name: Install Typst
    uses: typst-community/setup-typst@v4

  - name: Verify Typst
    run: typst --version

  - name: Run tests
    run: |
      cd test
      make clean
      make
      ! grep failure results.xml

  - name: Test Summary
    uses: test-summary/action@v2.3
    with:
      paths: "test/results.xml"
    if: always()

  - name: upload vcd
    if: success() || failure()
    uses: actions/upload-artifact@v4
    with:
      name: test-vcd
      path: |
        test/tb.vcd
        test/results.xml

  - name: Create PDF
    if: success()
    run: ./tt/tt_tool.py --create-pdf

  - name: Upload datasheet PDF
    if: success() || failure()
    uses: actions/upload-artifact@v4
    with:
      name: datasheet-pdf
      path: datasheet.pdf
      if-no-files-found: warn
```

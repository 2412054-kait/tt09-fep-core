name: test

on:
push:
workflow_dispatch:

jobs:
test:
runs-on: ubuntu-24.04

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Install iverilog
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y iverilog

  # Set Python up and install cocotb
  - name: Setup python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install Python packages
    shell: bash
    run: pip install -r test/requirements.txt

  # Install Typst for PDF generation
  - name: Install Typst
    uses: typst-community/setup-typst@v5

  # Verify Typst installation
  - name: Verify Typst
    shell: bash
    run: |
      which typst
      typst --version

  # Run Verilog tests
  - name: Run tests
    shell: bash
    run: |
      cd test
      make clean
      make
      # make may return success even if the test fails
      ! grep failure results.xml

  # Publish test results
  - name: Test Summary
    uses: test-summary/action@v2.3
    with:
      paths: "test/results.xml"
    if: always()

  # Upload VCD and test results
  - name: upload vcd
    if: success() || failure()
    uses: actions/upload-artifact@v4
    with:
      name: test-vcd
      path: |
        test/tb.vcd
        test/results.xml
      if-no-files-found: warn

  # Verify Typst immediately before PDF generation
  - name: Verify Typst before PDF
    shell: bash
    run: |
      which typst
      typst --version

  # Generate project datasheet PDF
  - name: Create PDF
    run: ./tt/tt_tool.py --create-pdf

  # Upload generated PDF
  - name: Upload datasheet PDF
    if: success() || failure()
    uses: actions/upload-artifact@v4
    with:
      name: datasheet-pdf
      path: datasheet.pdf
      if-no-files-found: warn
```

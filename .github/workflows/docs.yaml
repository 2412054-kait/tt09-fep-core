name: docs

on:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Verify Typst
        run: typst --version

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@tt09
